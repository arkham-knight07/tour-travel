<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Explore Globe — TravelMate</title>
    <link rel="stylesheet" href="../styles/main.css" />
    <style>
      body.theme-dark {
        --primary: #1a1a2e;
        --secondary: #16213e;
        --accent: #0f3460;
        --text: #eaeaea;
        --muted: #a0a0a0;
      }

      .globe-container {
        position: relative;
        width: 100%;
        height: 100vh;
        background: linear-gradient(
          135deg,
          var(--primary) 0%,
          var(--secondary) 100%
        );
        overflow: hidden;
      }

      #globeViz {
        width: 100%;
        height: 100%;
      }

      .globe-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        background: rgba(26, 26, 46, 0.95);
        backdrop-filter: blur(10px);
        padding: 20px;
        box-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
      }

      .globe-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .globe-header h1 {
        margin: 0;
        font-size: 1.8em;
        font-weight: 900;
        color: var(--text);
      }

      .globe-search {
        display: flex;
        gap: 10px;
        flex: 1;
        max-width: 400px;
        margin-left: 30px;
      }

      .globe-search input {
        flex: 1;
        padding: 10px 15px;
        border: 1px solid var(--accent);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.05);
        color: var(--text);
        font-size: 0.9em;
      }

      .globe-search input::placeholder {
        color: var(--muted);
      }

      .globe-search button {
        padding: 10px 20px;
        background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
        color: var(--text);
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s ease;
      }

      .globe-search button:hover {
        background: linear-gradient(135deg, #1a5f7a 0%, #1e2d4a 100%);
        transform: translateY(-2px);
      }

      .close-btn {
        background: none;
        border: none;
        color: var(--text);
        font-size: 1.5em;
        cursor: pointer;
        padding: 5px 10px;
        transition: color 0.3s ease;
      }

      .close-btn:hover {
        color: var(--accent);
      }

      .place-details {
        position: absolute;
        bottom: 30px;
        right: 30px;
        z-index: 20;
        background: rgba(26, 26, 46, 0.98);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(15, 52, 96, 0.3);
        border-radius: 12px;
        padding: 20px;
        max-width: 350px;
        min-width: 300px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        transform: translateY(400px);
        opacity: 0;
        transition: all 0.3s ease;
        pointer-events: none;
      }

      .place-details.active {
        transform: translateY(0);
        opacity: 1;
        pointer-events: auto;
      }

      .place-details h3 {
        margin: 0 0 10px 0;
        color: var(--text);
        font-size: 1.3em;
        font-weight: 700;
      }

      .place-details .category {
        display: inline-block;
        background: rgba(15, 52, 96, 0.5);
        color: var(--accent);
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.75em;
        font-weight: 600;
        margin-bottom: 10px;
      }

      .place-details p {
        margin: 8px 0;
        color: var(--muted);
        font-size: 0.9em;
        line-height: 1.5;
      }

      .place-details .image {
        width: 100%;
        height: 150px;
        border-radius: 8px;
        object-fit: cover;
        margin: 10px 0;
      }

      .place-details .btn {
        display: inline-block;
        margin-top: 15px;
        padding: 8px 16px;
        background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
        color: var(--text);
        text-decoration: none;
        border-radius: 6px;
        font-size: 0.85em;
        font-weight: 600;
        transition: all 0.3s ease;
        cursor: pointer;
        border: none;
      }

      .place-details .btn:hover {
        background: linear-gradient(135deg, #1a5f7a 0%, #1e2d4a 100%);
        transform: translateY(-2px);
      }

      .controls {
        position: absolute;
        bottom: 30px;
        left: 30px;
        z-index: 15;
        display: flex;
        gap: 15px;
        flex-direction: column;
      }

      .control-btn {
        width: 45px;
        height: 45px;
        border-radius: 50%;
        background: rgba(26, 26, 46, 0.9);
        border: 1px solid rgba(15, 52, 96, 0.3);
        color: var(--text);
        cursor: pointer;
        font-size: 1.2em;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
      }

      .control-btn:hover {
        background: rgba(15, 52, 96, 0.6);
        transform: scale(1.1);
      }

      .legend {
        position: absolute;
        top: 120px;
        left: 20px;
        z-index: 15;
        background: rgba(26, 26, 46, 0.9);
        border: 1px solid rgba(15, 52, 96, 0.3);
        border-radius: 8px;
        padding: 15px;
        max-width: 280px;
      }

      .legend h4 {
        margin: 0 0 12px 0;
        color: var(--text);
        font-size: 0.95em;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 0.85em;
      }

      .legend-marker {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }

      .marker-destination {
        background: #ff6b6b;
      }
      .marker-trek {
        background: #4ecdc4;
      }
      .marker-international {
        background: #ffd93d;
      }

      @media (max-width: 768px) {
        .globe-search {
          max-width: 200px;
        }

        .place-details {
          max-width: 90%;
          right: 20px;
          bottom: 20px;
        }

        .globe-header {
          flex-wrap: wrap;
        }

        .globe-header h1 {
          font-size: 1.3em;
          flex: 0 0 100%;
          margin-bottom: 10px;
        }

        .legend {
          top: auto;
          bottom: 120px;
          left: 20px;
          max-width: 250px;
        }
      }
    </style>
  </head>
  <body class="theme-dark">
    <div class="globe-container">
      <div id="globeViz"></div>

      <div class="globe-overlay">
        <div class="globe-header">
          <h1>🌍 Explore the World</h1>
          <div class="globe-search">
            <input
              id="placeSearch"
              type="text"
              placeholder="Search destinations..."
            />
            <button onclick="searchPlace()">Search</button>
          </div>
          <button class="close-btn" onclick="window.history.back()">
            &times;
          </button>
        </div>
      </div>

      <div class="legend">
        <h4>Place Types</h4>
        <div class="legend-item">
          <div class="legend-marker marker-destination"></div>
          <span>Domestic Destination</span>
        </div>
        <div class="legend-item">
          <div class="legend-marker marker-trek"></div>
          <span>Trek</span>
        </div>
        <div class="legend-item">
          <div class="legend-marker marker-international"></div>
          <span>International</span>
        </div>
      </div>

      <div class="controls">
        <button class="control-btn" title="Zoom In" onclick="zoomIn()">
          +
        </button>
        <button class="control-btn" title="Zoom Out" onclick="zoomOut()">
          −
        </button>
        <button class="control-btn" title="Reset" onclick="resetGlobe()">
          ⟲
        </button>
      </div>

      <div id="placeDetails" class="place-details">
        <h3 id="placeName">Place Name</h3>
        <span class="category" id="placeCategory">Category</span>
        <img
          id="placeImage"
          class="image"
          src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300'%3E%3Crect fill='%23ccc' width='400' height='300'/%3E%3Ctext x='50%' y='50%' text-anchor='middle' dy='.3em' fill='%23999' font-size='20'%3ENo Image%3C/text%3E%3C/svg%3E"
          alt="Place"
        />
        <p id="placeDescription">Description</p>
        <p id="placeCoords" style="font-size: 0.8em; color: var(--accent)">
          Coordinates
        </p>
        <button class="btn" id="exploreBtn" onclick="goToDestination()">
          Explore More →
        </button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@r128/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.31.2/dist/globe.gl.min.js"></script>
    <script src="../scripts/globe.js"></script>
  </body>
</html>
